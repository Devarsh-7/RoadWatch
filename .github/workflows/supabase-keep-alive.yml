name: Supabase Keep-Alive

on:
  schedule:
    # Runs daily at 04:15 UTC (off-peak to minimize GitHub Actions scheduling delays)
    - cron: '15 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        env:
          SUPABASE_URL: https://oplwnwgkkmdrbiytzmwb.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_ANON_KEY secret is not set in repository settings."
            exit 1
          fi

          # Temporarily disable exit-on-error so curl network/DNS failures can be diagnosed
          set +e
          response=$(curl -s -S -w "\n%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/roads?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" 2>&1)
          curl_exit=$?
          set -e

          if [ $curl_exit -ne 0 ]; then
            echo "Error: curl failed with exit code $curl_exit"
            echo "Output: $response"
            if [ $curl_exit -eq 6 ]; then
              echo "Diagnostic: Host could not be resolved (DNS NXDOMAIN). The Supabase project is likely paused in the Supabase Dashboard."
            fi
            exit 1
          fi

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully pinged Supabase. Database activity registered."
            exit 0
          elif [ "$http_code" -eq 540 ]; then
            echo "Error: Supabase returned HTTP 540 (Project Paused). Resume it from the Supabase Dashboard."
            exit 1
          else
            echo "Failed to ping Supabase (HTTP $http_code)"
            exit 1
          fi
