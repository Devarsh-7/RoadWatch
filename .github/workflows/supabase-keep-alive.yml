name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday (every 3-4 days to stay well within the 7-day inactivity limit)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://oplwnwgkkmdrbiytzmwb.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: SUPABASE_ANON_KEY secret is not set in repository settings."
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/roads?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully pinged Supabase. Database activity registered."
            exit 0
          else
            echo "Failed to ping Supabase (HTTP $http_code)"
            exit 1
          fi
